<div class="admin-wrapper" [class.sidebar-collapsed]="sidebarCollapsed">
  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">
        <i class="ti ti-school"></i>
      </div>
      <span class="brand-text">Learnify<span class="brand-accent">English</span></span>
      <span class="brand-badge">Admin</span>
    </div>

    <nav class="sidebar-nav">
      <span class="nav-section-title">Main Menu</span>
      @for (item of navItems; track item.path) {
        @if (!item.children) {
          <a [routerLink]="item.path"
             routerLinkActive="active"
             class="nav-item">
            <i [class]="item.icon"></i>
            <span class="nav-label">{{ item.label }}</span>
          </a>
        } @else {
          <div class="nav-group">
            <a [routerLink]="item.path"
               routerLinkActive="active"
               class="nav-item nav-parent">
              <i [class]="item.icon"></i>
              <span class="nav-label">{{ item.label }}</span>
              <i class="ti ti-angle-down nav-arrow"></i>
            </a>
            @for (child of item.children; track child.path) {
              <a [routerLink]="child.path"
                 routerLinkActive="active"
                 class="nav-item nav-child">
                <i [class]="child.icon"></i>
                <span class="nav-label">{{ child.label }}</span>
              </a>
            }
          </div>
        }
      }
    </nav>

    <div class="sidebar-footer">
      <a routerLink="/" class="nav-item back-link">
        <i class="ti ti-arrow-left"></i>
        <span class="nav-label">Back to Site</span>
      </a>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="admin-main">
    <!-- Header -->
    <header class="admin-header">
      <div class="header-left">
        <button class="sidebar-toggle" (click)="toggleSidebar()">
          <i class="ti ti-menu-2"></i>
        </button>
        <div class="search-box">
          <i class="ti ti-search"></i>
          <input type="text" placeholder="Search anything..." />
        </div>
      </div>
      <div class="header-right">
        <button class="header-icon-btn" title="Notifications">
          <i class="ti ti-bell"></i>
          <span class="notification-dot"></span>
        </button>
        <button class="header-icon-btn" title="Messages">
          <i class="ti ti-message"></i>
        </button>
        <div class="header-divider"></div>
        <div class="user-menu">
          <div class="user-avatar">
            <i class="ti ti-user"></i>
          </div>
          <div class="user-info">
            <span class="user-name">Admin User</span>
            <span class="user-role">Super Admin</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="admin-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
